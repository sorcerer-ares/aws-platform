name: Platform CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          PYTHONPATH: ./app
        run: pytest app/tests
      - name: Inspect GitHub OIDC Token Claims
        run: |
          # Request an OIDC token directly from GitHub's internal token service
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          
          # Decode and display the payload claims
          echo "=== Decoded JWT Payload ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub: .sub, aud: .aud, repository: .repository, repository_owner: .repository_owner}'
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357919579947:role/preview-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: dev-platform
          IMAGE_TAG: ${{ github.sha }}
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$PR_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$PR_TAG

      # --- TERRAFORM DEPLOYMENT ---

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.5

      - name: Deploy Ephemeral Environment via Terraform
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd terraform/modules/preview-env
          terraform init -backend-config="key=env/pr-${PR_NUM}.tfstate"
          terraform apply -auto-approve \
            -var="pr_number=${PR_NUM}" \
            -var="image_tag=${IMAGE_TAG}"
      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          ALB_DNS: "preview-platform-alb-789010252.us-east-1.elb.amazonaws.com"
          PR_NUMBER: ${{ github.event.number }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const albDns = process.env.ALB_DNS;
            const shortSha = process.env.COMMIT_SHA.substring(0, 7);
            const previewUrl = `http://${albDns}/pr-${prNumber}/`;
            const healthUrl = `http://${albDns}/pr-${prNumber}/health`;

            const commentHeader = '<!-- ephemeral-preview-bot -->';
            const body = `${commentHeader}
            ###  Ephemeral Preview Environment Ready!

            | Property | Value |
            | :--- | :--- |
            | **Status** | 🟢 Deployed |
            | **Preview URL** | [${previewUrl}](${previewUrl}) |
            | **Health Endpoint** | [${healthUrl}](${healthUrl}) |
            | **Latest Commit** | \`${shortSha}\` |
            | **PR Number** | \`#${prNumber}\` |

            *This environment will be automatically destroyed when this PR is closed.*`;

            // 1. Check for an existing comment left by this bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes(commentHeader));

            // 2. Update existing comment or create a new one
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
              console.log(`Updated existing comment ${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log('Created new PR preview comment.');
            }          
